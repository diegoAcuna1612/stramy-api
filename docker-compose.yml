services:
  app:
    build: ./
    volumes:
      - ./src:/usr/src/app/src
    ports:
      - '3000:3000'
    command: sh -c "npx prisma generate && npm run start:dev"
    environment:
      - PORT=${PORT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}

  stramy-db:
    container_name: stramy-db
    image: postgres:16.2
    restart: always
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=stramydb

  stramy-redis:
    container_name: stramy-redis
    image: redis:7.2 # Usamos la imagen oficial de Redis
    restart: always
    volumes:
      - redis_data:/data # Persistimos los datos de Redis
    command: redis-server --appendonly yes # Habilitamos persistencia
    ports:
      - '6379:6379'

volumes:
  redis_data: # Definimos el volumen para Redis
